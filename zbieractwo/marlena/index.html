<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12060d">
  <title>Kocham Marlenę ❤️</title>
  <meta name="description" content="Mała strona przygotowana specjalnie dla Marleny.">
  <style>
    :root {
      --night: #12060d;
      --wine: #3b0b24;
      --rose: #ff477e;
      --light-rose: #ff8fab;
      --cream: #fff5f7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 50% 38%, rgba(255, 71, 126, .22), transparent 28rem),
        linear-gradient(145deg, var(--night), var(--wine));
    }

    .stars,
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .stars {
      opacity: .55;
      background-image:
        radial-gradient(circle, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle, #ffd6e1 0 1px, transparent 1.5px);
      background-size: 72px 72px, 113px 113px;
      background-position: 12px 18px, 35px 59px;
      animation: shimmer 5s ease-in-out infinite alternate;
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(90vw, 720px);
      padding: clamp(2.25rem, 8vw, 5rem) clamp(1.5rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 2rem;
      background: rgba(20, 4, 14, .5);
      box-shadow: 0 2rem 6rem rgba(0, 0, 0, .42);
      backdrop-filter: blur(14px);
      animation: arrive 1.2s cubic-bezier(.2, .8, .2, 1) both;
    }

    .heart {
      width: 5.2rem;
      height: 5.2rem;
      margin: 0 auto 2.4rem;
      position: relative;
      transform: rotate(45deg);
      border-radius: .7rem;
      background: linear-gradient(135deg, var(--rose), #ff174f);
      box-shadow: 0 0 3rem rgba(255, 71, 126, .6);
      animation: heartbeat 1.3s ease-in-out infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 5.2rem;
      height: 5.2rem;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before { left: -2.6rem; }
    .heart::after { top: -2.6rem; }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 10vw, 6.5rem);
      line-height: .95;
      letter-spacing: -.05em;
      text-wrap: balance;
      text-shadow: 0 .3rem 2rem rgba(0, 0, 0, .35);
    }

    h1 span {
      display: block;
      margin-top: .12em;
      color: var(--light-rose);
      font-style: italic;
      animation: glow 2.6s ease-in-out infinite alternate;
    }

    .message {
      margin: 1.8rem auto 0;
      max-width: 32rem;
      font: 400 clamp(1rem, 3vw, 1.3rem)/1.7 system-ui, sans-serif;
      color: rgba(255, 245, 247, .8);
    }

    .signature {
      margin: 1.7rem 0 0;
      font-size: 1.05rem;
      font-style: italic;
      color: #ffd6e1;
    }

    .back {
      position: fixed;
      z-index: 3;
      top: 1.2rem;
      left: 1.2rem;
      padding: .7rem 1rem;
      color: var(--cream);
      font: 600 .9rem/1 system-ui, sans-serif;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(18, 6, 13, .45);
      backdrop-filter: blur(8px);
      transition: transform .2s ease, background .2s ease;
    }

    .back:hover,
    .back:focus-visible {
      transform: translateY(-2px);
      background: rgba(255, 71, 126, .22);
    }

    .floating-heart {
      position: absolute;
      bottom: -3rem;
      color: var(--light-rose);
      opacity: 0;
      filter: drop-shadow(0 0 .5rem rgba(255, 71, 126, .4));
      animation: float-up var(--duration) linear var(--delay) infinite;
    }

    @keyframes heartbeat {
      0%, 100% { transform: rotate(45deg) scale(1); }
      14% { transform: rotate(45deg) scale(1.12); }
      28% { transform: rotate(45deg) scale(1); }
      42% { transform: rotate(45deg) scale(1.09); }
      70% { transform: rotate(45deg) scale(1); }
    }

    @keyframes float-up {
      0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 0; }
      12% { opacity: .7; }
      80% { opacity: .5; }
      100% { transform: translate3d(var(--drift), -115vh, 0) rotate(35deg); opacity: 0; }
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(2rem) scale(.96); }
      to { opacity: 1; transform: none; }
    }

    @keyframes glow {
      from { text-shadow: 0 0 1rem rgba(255, 143, 171, .2); }
      to { text-shadow: 0 0 2.2rem rgba(255, 143, 171, .7); }
    }

    @keyframes shimmer {
      from { opacity: .35; }
      to { opacity: .7; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
      .floating-heart { display: none; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="hearts" aria-hidden="true">
    <span class="floating-heart" style="left:7%;--duration:10s;--delay:-2s;--drift:45px;font-size:1.4rem">♥</span>
    <span class="floating-heart" style="left:18%;--duration:13s;--delay:-7s;--drift:-35px;font-size:2rem">♥</span>
    <span class="floating-heart" style="left:31%;--duration:9s;--delay:-4s;--drift:55px;font-size:1rem">♥</span>
    <span class="floating-heart" style="left:47%;--duration:14s;--delay:-10s;--drift:-60px;font-size:1.7rem">♥</span>
    <span class="floating-heart" style="left:62%;--duration:11s;--delay:-1s;--drift:40px;font-size:1.2rem">♥</span>
    <span class="floating-heart" style="left:75%;--duration:12s;--delay:-8s;--drift:-45px;font-size:2.2rem">♥</span>
    <span class="floating-heart" style="left:89%;--duration:10s;--delay:-5s;--drift:30px;font-size:1.5rem">♥</span>
  </div>

  <a class="back" href="/zbieractwo/" aria-label="Wróć do strony głównej">← Kalkulator</a>

  <main class="card">
    <div class="heart" aria-hidden="true"></div>
    <h1>Kocham <span>Marlenę</span></h1>
    <p class="message">Każdego dnia trochę bardziej. Dziękuję, że jesteś. ❤️</p>
    <p class="signature">— Artur</p>
  </main>
</body>
</html>
